<title>Surplus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Outfit:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: black dot-grid ground, one column of big rounded tiles that glow from the top like lit panels.
   Deliberately dark-only: the design is a night device, so it sets every color for one look. */
:root{
  color-scheme:dark;
  --bg:#050506; --surface:#111113; --sunk:#19191C; --ink:#F3F3F5; --muted:#8D8D96; --dim:#5B5B63;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.18);
  --red-plus:#FF3B30; --lime:#DDF46A; --peri:#9598F4; --coral:#F2836B; --cream:#F1DCBC; --pink:#E86AAA; --amber:#F5B24E; --silver:#B8B8C2;
  --accent:#A9ACFF; --accent-ink:#0B0B12; --accent-soft:rgba(149,152,244,.14);
  --good:var(--lime); --good-soft:rgba(221,244,106,.12); --warn:#F5B24E; --warn-soft:rgba(245,178,78,.12);
  --plate-red:#FF6A55; --plate-blue:#9598F4; --plate-yellow:#F5C451; --plate-green:var(--lime); --steel:#C7C7D0;
  --f-dot:"Doto","JetBrains Mono",ui-monospace,monospace;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:26px;
}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.3px);background-size:16px 16px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:300;text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
/* glowing tile: --g is the light color bleeding in from the top edge */
.glow{--g:var(--silver);background:radial-gradient(140% 85% at 50% -20%,color-mix(in srgb,var(--g) 62%,transparent) 0%,color-mix(in srgb,var(--g) 20%,transparent) 42%,transparent 72%),var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{display:block;width:40px;height:40px;border-radius:11px;background:#0B0B0D;border:1px solid var(--line-2)}
.brand-mark svg{display:block;width:100%;height:100%}
.syncdot[hidden]{display:none}
.syncdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:7px;vertical-align:1px;box-shadow:0 0 6px var(--amber)}
.dotplus .on{fill:var(--red-plus)}
.dotplus .off{fill:#26262B}
.brand-name{font-family:var(--f-display);font-weight:300;font-size:21px;letter-spacing:-.01em;line-height:1.05}
.brand-sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:3px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#0B0B0D}

.wrap{padding-block:20px 64px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* date strip */
.datebar{display:flex;align-items:center;gap:10px;padding-block:4px}
.datebar .d-label{flex:1;min-width:0;text-align:center}
.datebar h2{font-size:34px;font-weight:200}
.datebar h2 span{display:block;font-family:var(--f-mono);font-size:11px!important;letter-spacing:.12em;text-transform:uppercase;font-weight:400!important;margin-top:2px}
.iconbtn{border:1px solid var(--line-2);background:rgba(255,255,255,.04);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--ink)}
.pill{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:7px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.pill.primary{background:var(--lime);border-color:var(--lime);color:#111}

/* calorie hero: the magenta "last test" panel */
.hero{display:grid;grid-template-columns:1fr;gap:8px;justify-items:center;text-align:center;padding:22px 18px 18px;border-radius:32px;border:1px solid rgba(255,255,255,.12);
  background:radial-gradient(120% 75% at 50% -5%,#F08BC0 0%,#B4428F 30%,#4A1840 62%,#170A15 88%);box-shadow:0 18px 50px -18px rgba(232,106,170,.45),inset 0 1px 0 rgba(255,255,255,.25);--line:rgba(255,255,255,.35)}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero-nums{display:flex;flex-direction:column;align-items:center;gap:2px}
.big{font-family:var(--f-dot);font-weight:900;font-size:68px;line-height:1;letter-spacing:.03em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 22px rgba(255,255,255,.35)}
.of{font-family:var(--f-mono);color:rgba(255,255,255,.7);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.hero-sub{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:13px;color:rgba(255,255,255,.75)}
.hero-sub b{font-family:var(--f-mono);font-weight:700;color:#fff}
.bar-svg{width:100%;max-width:520px;height:auto;display:block;margin:2px auto 0}
.plate-key{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.plate-key i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.verdict{border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500}
.hero .verdict.go{background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.verdict.go{background:rgba(255,255,255,.06);color:var(--ink)}
.verdict.done{background:var(--good-soft);color:var(--lime);border:1px solid rgba(221,244,106,.35)}
.hero .verdict.done{background:rgba(0,0,0,.4)}

/* scenario-style pills: outlined, the chosen one lit with a gradient */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:96px;border:1px solid var(--line-2);background:rgba(255,255,255,.02);border-radius:16px;padding:10px 10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-align:center;line-height:1.3}
.seg button small{display:block;font-family:var(--f-body);font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.seg button[aria-pressed="true"]{border-color:transparent;background:linear-gradient(100deg,#F07FB5 0%,#F5A86A 55%,#F5C451 100%);color:#1A0A12;box-shadow:0 8px 24px -10px rgba(240,127,181,.7)}
.seg button[aria-pressed="true"] small{color:rgba(26,10,18,.72)}

/* meals: each slot is a lit panel */
.meal{overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;flex-wrap:wrap}
.meal-h .time{font-family:var(--f-dot);font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--ink);min-width:70px}
.meal-h h3{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;flex:1;min-width:0;color:var(--ink)}
.meal-k{font-family:var(--f-mono);font-size:12px;color:rgba(243,243,245,.75)}
.meal.done .meal-h h3::after{content:" · eaten";color:var(--lime)}
.mini{border:1px solid var(--line-2);background:rgba(0,0,0,.35);border-radius:999px;padding:6px 12px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 18px;color:var(--ink)}
.item:first-of-type{border-top:0}
.item:hover{background:rgba(255,255,255,.035)}
.box{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:#121212;transition:background .15s,border-color .15s,box-shadow .15s}
.box svg{width:13px;height:13px;opacity:0}
.item.on .box{background:var(--lime);border-color:var(--lime);box-shadow:0 0 12px rgba(221,244,106,.45)}
.item.on .box svg{opacity:1}
.item-name{flex:1;min-width:0}
.item.on .item-name{color:var(--muted)}
.item-num{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.item-num b{color:var(--ink);font-weight:500}
.note{font-size:13px;color:var(--muted)}
.meal-h .time small{font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.addrow{border-top:1px solid var(--line);padding:10px 18px}
.card .addrow{border-top:0;padding:0}
.addbtn{border:0;background:transparent;color:var(--accent);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 0}
.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addform input:not([type=checkbox]){padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:#0A0A0C;color:var(--ink);font-size:15px;font-family:var(--f-body);min-width:0}
.addform input[type=text]{flex:1 1 200px}
.addform input[type=number]{width:104px;font-family:var(--f-mono)}
.savechk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.savechk input{accent-color:var(--lime)}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-left:8px;border:1px solid rgba(169,172,255,.4);border-radius:999px;padding:1px 6px;vertical-align:2px}
.xbtn{flex:none;border:1px solid var(--line-2);background:transparent;width:28px;height:28px;border-radius:50%;font-size:11px;line-height:1;color:var(--muted)}
.ownlist{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.chip.mine{border-style:solid;border-color:rgba(169,172,255,.5)}

/* tip: a small lit panel with a pulsing dot */
.tipbar{display:flex;align-items:flex-start;gap:10px 12px;flex-wrap:wrap;padding:14px 18px;--g:var(--peri)}
.tipbar p{margin:0;flex:1 1 260px;min-width:0;font-size:14.5px;font-weight:300;line-height:1.5}
.tip-tag{flex:none;width:100%;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#D9DAFF}
.tip-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.tline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tline b{color:var(--ink);font-weight:500}
.tline i{font-style:normal;color:var(--dim)}
.week button.wkbtn{border:1px solid var(--line-2);border-radius:14px;background:transparent;padding:8px 2px;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;line-height:1.35;text-align:center;color:var(--muted)}
.wkbtn b{display:block;font-size:11.5px;color:var(--ink);font-weight:500}
.wkbtn.free{background:var(--good-soft);border-color:rgba(221,244,106,.45);color:var(--lime)}
.wkbtn.noshift{background:var(--accent-soft);border-color:rgba(169,172,255,.45);color:var(--accent)}
.week div .wt{display:block;font-size:9.5px;opacity:.7}

/* extras + habits */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.chip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px dashed var(--line-2);background:rgba(255,255,255,.02);border-radius:16px;padding:11px 13px;text-align:left;color:var(--ink)}
.chip .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip.has{border-style:solid;border-color:rgba(221,244,106,.5);background:var(--good-soft)}
.chip .count{position:absolute;top:9px;right:11px;font-family:var(--f-dot);font-weight:900;font-size:16px;color:var(--lime)}
.chip-wrap{position:relative}
.chip-minus{position:absolute;bottom:8px;right:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);background:#0A0A0C;color:var(--ink);font-weight:500;line-height:1;display:grid;place-items:center}

/* habits: switches, like the "Training" toggle */
.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.habit{display:flex;align-items:center;justify-content:space-between;flex-direction:row-reverse;gap:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:18px;padding:12px 14px;text-align:left;font-size:14px;color:var(--ink)}
.habit > span:last-child{flex:1;min-width:0}
.habit small{display:block;color:var(--muted);font-size:12px}
.habit .box{width:42px;height:24px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.06);position:relative;display:block}
.habit .box svg{display:none}
.habit .box::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.habit.on .box{background:linear-gradient(90deg,#3B3F9E,var(--peri));border-color:transparent}
.habit.on .box::after{transform:translateX(18px);background:#fff}

/* gym */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);padding:8px 2px;text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;text-transform:uppercase;line-height:1.35;color:var(--muted)}
.week div b{display:block;font-size:11.5px;color:var(--ink);font-weight:500}
.week div.cur{background:var(--ink);color:#2A2A30;border-color:var(--ink)}
.week div.cur b{color:#0B0B0D}
.week div.did{box-shadow:inset 0 0 0 1.5px var(--lime)}
.ex{display:grid;gap:12px;padding:18px;--g:var(--peri)}
.ex.complete{--g:var(--lime);border-color:rgba(221,244,106,.35)}
.ex-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ex-h h3{font-size:19px;font-weight:300;flex:1;min-width:0}
.ex-meta{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(243,243,245,.7)}
.sets{display:flex;gap:10px;flex-wrap:wrap}
.setbox{width:54px;height:54px;border-radius:50%;border:1px solid var(--line-2);background:rgba(0,0,0,.35);display:grid;place-items:center;font-family:var(--f-dot);font-weight:900;font-size:17px;line-height:1;text-align:center;color:var(--ink);transition:background .15s,box-shadow .15s}
.setbox.on{background:var(--lime);border-color:var(--lime);color:#111;box-shadow:0 0 18px rgba(221,244,106,.5);font-family:var(--f-body);font-weight:600}
.setbox small{display:block;font-family:var(--f-mono);font-size:8.5px;font-weight:400;letter-spacing:.1em;color:var(--muted);margin-top:2px}
.kg{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kg input{width:92px;padding:9px 11px;border:1px solid var(--line-2);border-radius:12px;background:#0A0A0C;color:var(--ink);font-family:var(--f-mono);font-size:15px}
.kg .last{flex:1 1 200px;min-width:0}
.kg .last b{color:var(--ink);font-weight:500}
.howbtn{justify-self:start;border:1px solid var(--line-2);background:rgba(0,0,0,.3);border-radius:999px;padding:6px 13px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.howto{display:grid;gap:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.posefig{margin:0;display:grid;gap:6px;justify-items:center;padding:10px 8px 8px;border-radius:14px;background:radial-gradient(90% 80% at 50% 30%,rgba(149,152,244,.14),transparent 70%),#08080A;border:1px solid var(--line)}
.pose{width:100%;max-width:340px;height:auto;display:block}
.posefig figcaption{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.howto ol{margin:0;padding-left:20px;display:grid;gap:6px;font-weight:300;font-size:14.5px}
.howto li::marker{color:var(--lime);font-family:var(--f-mono)}
.howto b{color:var(--amber);font-weight:500}
a.pill{text-decoration:none;display:inline-block}
a.pill.vid{background:linear-gradient(100deg,#F07FB5,#F5A86A);border-color:transparent;color:#1A0A12}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:3px;min-height:158px;padding:16px 16px 12px;text-align:left;color:var(--ink);border-radius:26px;min-width:0;
  background:radial-gradient(140% 95% at 50% -18%,color-mix(in srgb,var(--g) 88%,transparent) 0%,color-mix(in srgb,var(--g) 32%,transparent) 42%,transparent 76%),var(--surface)}
.tile:hover{border-color:var(--line-2)}
.tile .t-v{font-family:var(--f-dot);font-weight:900;font-size:30px;line-height:1.05;letter-spacing:.02em}
.tile .t-v.word{font-family:var(--f-display);font-weight:300;font-size:24px;letter-spacing:-.01em}
.tile .t-s{font-size:12px;font-weight:300;color:rgba(243,243,245,.78)}
.tile .t-s small{font-size:10px;color:var(--muted)}
.tile .t-tip{font-size:13px;font-weight:300;line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tile .t-l{align-self:center;margin-top:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.setcol{display:grid;gap:6px;justify-items:center}
.setkg{width:58px;padding:6px 4px;border:1px solid var(--line-2);border-radius:10px;background:#0A0A0C;color:var(--ink);font-family:var(--f-mono);font-size:13px;text-align:center}
.setkg::placeholder{color:var(--dim)}
.best{display:flex;align-items:baseline;gap:5px}
.best b{font-family:var(--f-dot);font-weight:900;font-size:24px;color:var(--lime)}
.best small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.pr{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#111;background:var(--lime);border-radius:999px;padding:2px 7px;box-shadow:0 0 12px rgba(221,244,106,.5)}
.spark{flex:none;display:block}
.lift{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lift:first-of-type{border-top:0}
.lift-n{flex:1;min-width:0;font-weight:300}
.lift-n small{display:block;font-size:12px;color:var(--muted)}
.lift-n small b{color:var(--lime);font-weight:500}
.lift-b{text-align:right;min-width:62px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.stat:nth-child(2){background:radial-gradient(120% 90% at 100% 0%,rgba(149,152,244,.45),transparent 60%),var(--surface)}
.stat:nth-child(4){background:radial-gradient(120% 90% at 50% 120%,rgba(242,131,107,.55),transparent 65%),var(--surface)}
.stat .v{font-family:var(--f-dot);font-weight:900;font-size:34px;line-height:1.1;letter-spacing:.03em;margin-top:6px}
.stat .v small{font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form label{display:grid;gap:5px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.form input[type=number]{width:110px}
.advice{border-radius:18px;padding:13px 16px;font-size:14px;font-weight:300;border:1px solid var(--line)}
.advice b{font-weight:500}
.advice.ok{background:var(--good-soft);border-color:rgba(221,244,106,.3)}
.advice.low{background:var(--warn-soft);border-color:rgba(245,178,78,.35)}
.advice.info{background:rgba(255,255,255,.035)}

/* guide */
.guide{display:grid;gap:14px}
.guide section{background:radial-gradient(130% 60% at 50% -10%,rgba(149,152,244,.16),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.guide section:nth-child(3n+2){background:radial-gradient(130% 60% at 50% -10%,rgba(242,131,107,.16),transparent 60%),var(--surface)}
.guide section:nth-child(3n){background:radial-gradient(130% 60% at 50% -10%,rgba(241,220,188,.14),transparent 60%),var(--surface)}
.guide h2{font-size:25px;font-weight:300;margin-bottom:10px}
.guide p,.guide li{max-width:66ch;font-weight:300}
.guide b{font-weight:500}
.guide p{margin:0 0 10px}
.guide ul,.guide ol{margin:0 0 10px;padding-left:20px;display:grid;gap:7px}
.guide li::marker{color:var(--lime)}
.guide table{border-collapse:collapse;width:100%;font-size:14px;font-weight:300}
.guide td,.guide th{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;text-align:left;vertical-align:top}
.guide th{font-family:var(--f-mono);font-size:10.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}
.guide a{color:var(--accent)}
.callout{border:1px solid rgba(245,178,78,.35);background:var(--warn-soft);padding:12px 14px;border-radius:16px}

        for (const id of Object.keys(S.docs)) if (!seen.has(id)) queueWrite(id);
      }
      saveLocal(); setSync("Saved to your account"); render();
    }, () => { setSync("Saved on this device only"); });
  } catch(e) {}
})();

/* ---------- derived numbers ---------- */
function dayTotals(day){
  let kcal = 0, prot = 0;
  for (const [id, on] of Object.entries(day.food || {})) if (on && ITEMS[id]) { kcal += ITEMS[id][2]; prot += ITEMS[id][3]; }
  for (const [id, n] of Object.entries(day.extras || {})) if (n > 0 && EXTRA_MAP[id]) { kcal += EXTRA_MAP[id][3]*n; prot += EXTRA_MAP[id][4]*n; }
  for (const c of Object.values(day.custom || {})) { kcal += +c.kcal || 0; prot += +c.prot || 0; }
  return {kcal, prot};
}
const menuOf = k => getDay(k).menu || defaultMenu(k);
// each meal can be swapped on its own: day.swap[slot] = "A" | "B" | "C"
const mealOf = (k, slot) => MENUS[(getDay(k).swap || {})[slot] || menuOf(k)].meals.find(ml => ml.id === slot);
const menuTotal = m => MENUS[m].meals.reduce((a,meal) => a + meal.items.reduce((b,i) => b+i[2], 0), 0);
const menuProt = m => MENUS[m].meals.reduce((a,meal) => a + meal.items.reduce((b,i) => b+i[3], 0), 0);
// Gym days get the next session in the Upper A → Lower A → Upper B → Lower B rotation.
// Logged days anchor the rotation; unlogged past days don't advance it, so a missed day never skips a session.
function sessionOf(k){
  const d = getDay(k);
  if (d.gym && "session" in d.gym) return d.gym.session;
  if (!schedOf(k).gym) return null;
  const t = todayKey();
  let steps = 0;
  for (let i = 1; i <= 42; i++) {
    const pk = addDays(k, -i), pd = getDay(pk);
    if (pd.gym && "session" in pd.gym) { if (pd.gym.session) return ORDER[(ORDER.indexOf(pd.gym.session) + 1 + steps) % 4]; continue; }
    if (pk >= t && schedOf(pk).gym) steps++;
  }
  return ORDER[steps % 4];
}
function sessionProgress(k){
  const sid = sessionOf(k); if (!sid) return null;
  const sets = (getDay(k).gym || {}).sets || {};
  let done = 0, total = 0;
  for (const ex of SESSIONS[sid].ex) { total += ex[2]; for (let i=0;i<ex[2];i++) if ((sets[ex[0]]||[])[i]) done++; }
  return {sid, done, total};
}
// kg per set: gym.setkg[ex] = [kg, kg, ...]; older days stored one gym.kg[ex] for the whole exercise
function kgsOf(d, exId){
  const g = d.gym || {};
  const arr = ((g.setkg || {})[exId] || []).filter(v => typeof v === "number" && v > 0);
  if (arr.length) return (g.setkg[exId]).map(v => typeof v === "number" && v > 0 ? v : null);
  const one = (g.kg || {})[exId];
  return typeof one === "number" && one > 0 ? [one] : [];
}
// every session of one exercise, oldest first: {date, kgs, top}
function liftHistory(exId){
  const out = [];
  for (const [id, d] of Object.entries(S.docs)) {
    if (!id.startsWith("day-") || !d.date) continue;
    const kgs = kgsOf(d, exId), nums = kgs.filter(v => v);
    if (nums.length) out.push({date:d.date, kgs, top:Math.max(...nums)});
  }
  return out.sort((a,b) => a.date < b.date ? -1 : 1);
}
function spark(hist, w = 96, h = 30){
  if (hist.length < 2) return "";
  const pts = hist.slice(-12), lo = Math.min(...pts.map(p => p.top)), hi = Math.max(...pts.map(p => p.top)), r = Math.max(hi - lo, 1);
  const X = i => 3 + i * (w - 6) / (pts.length - 1), Y = v => h - 4 - (v - lo) / r * (h - 8);
  const line = pts.map((p,i) => `${X(i).toFixed(1)},${Y(p.top).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${line}" fill="none" stroke="var(--lime)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1].top)}" r="3" fill="var(--lime)"/></svg>`;
}
function weightEntries(){
  return Object.values(S.docs).filter(d => d && d.date && typeof d.weight === "number").map(d => ({date:d.date, kg:d.weight})).sort((a,b) => a.date < b.date ? -1 : 1);
}

function dotPlusSVG(){

}

function barbell(kcal){
  const full = Math.floor(kcal / PLATE), frac = (kcal % PLATE) / PLATE;
  const COL = ["--plate-red","--plate-red","--plate-blue","--plate-blue","--plate-yellow","--plate-yellow"];
  const HT = [96,96,96,96,82,82];
  const shown = Math.min(Math.max(6, full + (frac > 0 ? 1 : 0)), 12);
  let plates = "";
  for (let k = 1; k <= shown; k++) {
    const left = k % 2 === 1, idx = Math.ceil(k/2) - 1, w = 11, step = 13;
    const x = left ? 102 - (idx+1)*step + 2 : 258 + idx*step;
    const h = k <= 6 ? HT[k-1] : 66, y = 55 - h/2;
    const color = `var(${k <= 6 ? COL[k-1] : "--plate-green"})`;
    if (k <= full) plates += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2.5" fill="${color}"/>`;
    else {
      if (k <= 6) plates += `<rect x="${x+.75}" y="${y+.75}" width="${w-1.5}" height="${h-1.5}" rx="2" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      if (k === full + 1 && frac > 0) { const fh = h*frac; plates += `<rect x="${x}" y="${y+h-fh}" width="${w}" height="${fh}" rx="2.5" fill="${color}" opacity=".45"/>`; }
    }
  }
  return `<svg class="bar-svg" viewBox="0 0 360 110" role="img" aria-label="${fmt(kcal)} of ${fmt(GOAL_KCAL)} kcal loaded on the bar">
    <rect x="12" y="50" width="92" height="10" rx="2" fill="var(--steel)"/>
    <rect x="256" y="50" width="92" height="10" rx="2" fill="var(--steel)"/>
    <rect x="104" y="52.5" width="152" height="5" rx="2" fill="var(--steel)"/>
    <rect x="104" y="44" width="5" height="22" rx="1.5" fill="var(--steel)"/>
    <rect x="251" y="44" width="5" height="22" rx="1.5" fill="var(--steel)"/>
    ${plates}
  </svg>`;
}

function weightChart(entries){

  const X = d => L + (d - d0) / span * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);

    <ul>
      <li><b>Drink calories.</b> The mass shake is 500 kcal in three minutes and barely fills you. Liquids are the hard-gainer's best friend. If 3,000 feels impossible, double the shake before cutting a meal.</li>
      <li><b>Eat on the clock, not on hunger.</b> Your appetite is used to 50 kg. Eat at the planned times even if you're not hungry. Appetite catches up after 2–3 weeks.</li>
      <li><b>Pick dense foods.</b> Plov, walnuts, kuraga, raisins, halva, whole milk, suzma, smetana, non, honey, peanut butter. One spoon of oil is 120 kcal you can't even taste.</li>
      <li><b>Don't fill up on air.</b> Go easy on big salads, soup, diet soda and water right before meals. Drink most of your water between meals.</li>
      <li><b>Never skip breakfast.</b> A missed meal is 500–600 kcal you won't make up at night.</li>
      <li><b>Boiled eggs are a great breakfast.</b> One egg is about 72 kcal and 6 g of high-quality protein, boiled or fried; frying only adds the oil or butter. Eat the whole egg: after training, whole eggs built more muscle protein than the same protein from egg whites alone. 2–3 eggs a day is fine for a healthy person. Since boiled eggs have no added fat, put butter on the non or add a glass of milk to keep breakfast big.</li>
      <li><b>Keep snacks on you.</b> Walnuts, kuraga, a samsa from the corner shop. Those are the "extra plates" on the Food tab.</li>
    </ul>
  </section>

  <section>
    <h2>"Fast metabolism": what's really going on</h2>
    <p>Thin people's organs don't burn much more than anyone else's. The big difference between people is called NEAT: all the movement that isn't exercise, like walking, standing, fidgeting and your job. In a well-known study, 16 people ate 1,000 kcal a day extra for 8 weeks. Fat gain differed about 10-fold between them, and the ones who gained least had automatically started moving more, burning off much of the extra food without noticing.</p>
    <p>So people who "can't gain" usually move a lot and eat less than they think. What works:</p>
    <ul>
      <li><b>Walk less where it costs nothing.</b> Take the metro or bus instead of the long walk, the lift instead of stairs, sit on your breaks. A 20-minute walk on rest days is fine; long walks for fun aren't, for now.</li>
      <li><b>No extra cardio.</b> Lifting is your exercise. If you play football or run, add a second shake that day.</li>
      <li><b>Physical job?</b> If you're on your feet all shift you may burn 300–500 kcal more than the estimate, so your real number could be 3,300–3,500. The Progress tab tells you after two weeks.</li>
      <li><b>Don't trust your hunger.</b> Small eaters feel full early. Eat on the clock, drink calories, pick dense foods.</li>
      <li><b>Watch appetite killers.</b> Energy drinks, lots of coffee, cigarettes and vapes all reduce hunger.</li>
    </ul>
  </section>

  <section>
    <h2>Night-shift playbook</h2>
    <p>Your week lives in the Week tab, in Tashkent time. Each day is named after the date its night shift starts and runs from wake-up to bed. The app puts bed soon after your last shift, class or gym, wakes you an hour before the next one (never more than 9 hours later), adds a nap when there's a 4-hour gap, and spreads your 6 meals over the hours you're awake.</p>
    ${weekTable()}
    <p style="margin-top:10px">When IUT changes your timetable, change the times in the Week tab; sleep and meals follow on their own.</p>
    <ul style="margin-top:10px">
      <li><b>Pack the shift food before you leave.</b> Two containers plus the shaker. Plov, rice and chicken, lagman in a thermos and manti all reheat well.</li>
      <li><b>Eat on alarms.</b> Your body clock turns hunger down at night. Set a phone alarm for every meal time.</li>
      <li><b>Caffeine:</b> none in the 6 hours before bed. The Food tab shows each day's bedtime.</li>
      <li><b>Daytime sleep:</b> blackout curtains or an eye mask, earplugs, a cool room, phone on silent. Sunglasses on the metro home from Oybek help you fall asleep faster.</li>
      <li><b>Monday is your longest stretch:</b> shift from 00:00 to about 07:30, then the short walk to IUT for class until 11:00. That walk is fine; it's the long extra walks to skip. Pack two meals and the shake.</li>
      <li><b>Take the Tuesday nap.</b> The shift ends at 10:00, gym until about 11:15, and class starts at 15:00. A nap in that gap is your recovery from the session, and it keeps you from being awake for most of a day and a night.</li>
      <li><b>Light last meal.</b> The meal right before bed is the lighter one (the snack or the shake), so a full stomach doesn't wreck your sleep.</li>
    </ul>
  </section>

  <section>
    <h2>Creatine</h2>
    <ul>
      <li><b>What to buy:</b> plain creatine monohydrate powder. It's the most researched supplement there is, and the cheapest one works the same as fancy versions. In Tashkent, buy from a proper sports-nutrition store rather than a random seller, because fake supplements are common.</li>
      <li><b>How much:</b> 3–5 g every day, including rest days. Timing doesn't matter; the shake is an easy place for it.</li>
      <li><b>Loading is optional:</b> 20 g a day (4 × 5 g) for 5–7 days fills your muscles in a week. 5 g a day gets you to the same place in 3–4 weeks with less chance of an upset stomach.</li>
      <li><b>What it does:</b> a few more reps per set, which adds up to more muscle over months. Plus 1–2 kg of water stored inside the muscle.</li>
      <li><b>Safety:</b> in healthy people, research up to 5 years shows no harm. If you have kidney problems, ask a doctor first. Drink plenty of water.</li>
    </ul>
  </section>

  <section>
    <h2>The gym program</h2>
    <p><b>12–13 sessions a month:</b> Upper/Lower split on <b>Tuesday, Thursday and Saturday</b>: <b>Upper A → Lower A → Upper B → Lower B</b>, then repeat. Tuesday and Saturday you train right after the shift; Thursday right after your 11:00–12:00 class. There's always a rest day in between, so each muscle gets 48 hours to recover. With 3 sessions a week the order keeps rolling, so each week starts where the last one ended. Three sessions gives every muscle about 8–11 hard sets a week, which is plenty for a beginner.</p>
    <p><b>Skipped a day?</b> Tap "Skip today" in the Gym tab. The skipped session moves to your next gym day instead of being lost, and you can undo it. You can also train on any other day by picking a session there.</p>
    <ul>
      <li><b>Weeks 1–2:</b> learn the form with light weights. Film your squat and deadlift if you can.</li>
      <li><b>Log every set's kg.</b> Under each set there's a kg box. The app shows last time's sets (e.g. 8 · 8 · 10), your best ever, and a line of how it grows. Progress tab → Strength has all exercises together.</li>
      <li><b>Every session:</b> try to beat last time by one rep or a little weight. Going lighter on some days is normal; your best stays saved.</li>
      <li><b>Effort:</b> end most sets with 1–2 reps left in the tank. Never grind ugly reps.</li>
      <li><b>Every 8–10 weeks:</b> take a lighter week (half the sets) to recover.</li>
      <li><b>Can't do a pull-up?</b> Use the assisted machine or do lat pulldowns instead.</li>
    </ul>
  </section>

  <section>
    <h2>When to see a doctor</h2>
    <p class="callout">A BMI of 16 is in the underweight range. A quick check-up with a GP is worth it if you've lost weight without trying, often have stomach pain, bloating or diarrhoea after meals, or if a month of honest 3,000+ kcal days doesn't move the scale. Things like thyroid problems or coeliac disease can make gaining weight very hard, and they're easy to test for.</p>
  </section>

  <section>
    <h2>Sources</h2>
    <ul>
      <li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5477153/" target="_blank" rel="noopener">ISSN position stand: protein and exercise (Jäger et al., 2017)</a></li>
      <li><a href="https://doi.org/10.1186/s12970-017-0173-z" target="_blank" rel="noopener">ISSN position stand: safety and efficacy of creatine (Kreider et al., 2017)</a></li>
      <li><a href="https://doi.org/10.1080/02640414.2016.1210197" target="_blank" rel="noopener">Dose-response of weekly training volume and muscle growth (Schoenfeld et al., 2017)</a></li>
      <li><a href="https://pubmed.ncbi.nlm.nih.gov/?term=Garthe+nutritional+intervention+body+composition+elite+athletes+2013" target="_blank" rel="noopener">Weight-gain diet in elite athletes: more fat, same muscle (Garthe et al., 2013)</a></li>
      <li><a href="https://pubmed.ncbi.nlm.nih.gov/?term=Helms+energy+surplus+resistance-trained+skinfold" target="_blank" rel="noopener">Small vs large energy surpluses in lifters (Helms et al.)</a></li>
      <li><a href="https://pubmed.ncbi.nlm.nih.gov/?term=van+Vliet+whole+eggs+egg+whites+muscle+protein+synthesis" target="_blank" rel="noopener">Whole eggs vs egg whites after resistance exercise (van Vliet et al., 2017)</a></li>
      <li><a href="https://pubmed.ncbi.nlm.nih.gov/9880251/" target="_blank" rel="noopener">NEAT and resistance to fat gain with overfeeding (Levine et al., Science 1999)</a></li>
      <li><a href="https://www.healthpartners.com/blog/shift-work-sleep-tips/" target="_blank" rel="noopener">Sleep tips for shift workers (HealthPartners)</a></li>
    </ul>
    <p class="note">Calorie values are typical values; home-cooked plov, lagman, manti and non vary a lot, so treat them as estimates. This is general guidance, not medical advice.</p>
  </section>

/* ---------- render + events ---------- */
let pendingRender = false, pointerDown = false;
function render(){
  const a = document.activeElement;
  if (a && a.tagName === "INPUT" && view.contains(a)) { pendingRender = true; return; }
  pendingRender = false;
  planCache.clear();
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === UI.tab));
  view.innerHTML = UI.tab === "food" ? renderFood() : UI.tab === "gym" ? renderGym() : UI.tab === "week" ? renderWeek() : UI.tab === "progress" ? renderProgress() : renderGuide();
  kickPoses();
}
function goTab(t){
  UI.tab = t; try { localStorage.setItem("road65.tab", t); } catch(err) {}
  pendingRender = false; if (document.activeElement) document.activeElement.blur();
  render(); window.scrollTo({top:0});
}
document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
document.addEventListener("pointerup", () => { pointerDown = false; if (pendingRender) setTimeout(() => { if (pendingRender) render(); }, 0); }, true);
view.addEventListener("focusout", () => { if (pendingRender && !pointerDown) setTimeout(render, 0); });

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (b) goTab(b.dataset.tab);
});
// schedule edits: settings.sched[weekday] = {shift:[from,to]|null, uni:[from,to]|null, gym}
function patchSched(dw, fn){
  patchDoc("settings", d => {
    d.sched = d.sched || {};
    const cur = structuredClone(d.sched[dw] || DEFAULT_SCHED[dw]);
    fn(cur); d.sched[dw] = cur;
  });
}

view.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "INPUT") return;
  const k = UI.date, act = b.dataset.act;
  if (act === "day") { UI.date = addDays(k, +b.dataset.n); render(); }
  else if (act === "today") { UI.date = todayKey(); render(); }
  else if (act === "food") patchDay(k, d => { d.food = d.food || {}; d.food[b.dataset.id] = !d.food[b.dataset.id]; if (!d.food[b.dataset.id]) delete d.food[b.dataset.id]; });
  else if (act === "meal") patchDay(k, d => {
    const meal = mealOf(k, b.dataset.meal);
    d.food = d.food || {};
    const allOn = meal.items.every(i => d.food[i[0]]);
    for (const i of meal.items) { if (allOn) delete d.food[i[0]]; else d.food[i[0]] = true; }
  });
  else if (act === "swap") patchDay(k, d => {
    const slot = b.dataset.slot, base = menuOf(k), order = ["A","B","C"];
    d.swap = d.swap || {};
    const next = order[(order.indexOf(d.swap[slot] || base) + 1) % 3];
    if (next === base) delete d.swap[slot]; else d.swap[slot] = next;
  });
  else if (act === "gotab") goTab(b.dataset.tab);
  else if (act === "backup") saveBackup();
  else if (act === "howto") { const ex = b.dataset.ex; if (UI.howto.has(ex)) UI.howto.delete(ex); else UI.howto.add(ex); render(); }
  else if (act === "schgym") patchSched(b.dataset.d, s => { s.gym = !s.gym; });
  else if (act === "schreset") patchDoc("settings", d => { delete d.sched; });
  else if (act === "tip") { UI.tip++; render(); }
  else if (act === "addopen") { UI.addSlot = b.dataset.slot; render(); const n = document.getElementById("cf-name"); if (n) n.focus(); }
  else if (act === "addcancel") { UI.addSlot = null; if (document.activeElement) document.activeElement.blur(); render(); }
  else if (act === "cdel") patchDay(k, d => { if (d.custom) delete d.custom[b.dataset.id]; });
  else if (act === "myfood") {
    const f = ((S.docs.settings || {}).myFoods || []).find(x => x.id === b.dataset.id); if (!f) return;
    patchDay(k, d => { d.custom = d.custom || {}; d.custom["c" + Date.now().toString(36)] = {slot:"extra", name:f.name, kcal:f.kcal, prot:f.prot}; });
  }
  else if (act === "forget") patchDoc("settings", d => { d.myFoods = (d.myFoods || []).filter(x => x.id !== b.dataset.id); });
  else if (act === "extra") patchDay(k, d => {
    d.extras = d.extras || {};
    const n = Math.max(0, (d.extras[b.dataset.id] || 0) + Number(b.dataset.n));
    if (n) d.extras[b.dataset.id] = n; else delete d.extras[b.dataset.id];
  });
  else if (act === "habit") patchDay(k, d => { d.habits = d.habits || {}; d.habits[b.dataset.id] = !d.habits[b.dataset.id]; });
  else if (act === "session") patchDay(k, d => { d.gym = d.gym || {}; d.gym.session = b.dataset.s || null; delete d.gym.skipped; });
  // a skipped day is logged as "no session", so the rotation hands the same session to the next gym day
  else if (act === "skip") patchDay(k, d => { d.gym = d.gym || {}; d.gym.session = null; d.gym.skipped = true; });
  else if (act === "unskip") patchDay(k, d => { d.gym = d.gym || {}; delete d.gym.session; delete d.gym.skipped; });
  else if (act === "warm") patchDay(k, d => { d.gym = d.gym || {}; d.gym.warm = !d.gym.warm; });
  else if (act === "set") patchDay(k, d => {
    d.gym = d.gym || {}; d.gym.sets = d.gym.sets || {};
    if (!("session" in d.gym)) d.gym.session = sessionOf(k);
    const ex = b.dataset.ex, arr = (d.gym.sets[ex] || []).slice(); const i = +b.dataset.i;
    arr[i] = !arr[i]; for (let j = 0; j < arr.length; j++) arr[j] = !!arr[j];
    d.gym.sets[ex] = arr;
    // ticking a set with no kg typed saves the suggested kg, so the log fills itself
    if (arr[i] && !kgsOf(d, ex)[i]) {
      const before = liftHistory(ex).filter(h => h.date < k), sug = suggestKg(d, ex, i, before[before.length - 1]);
      if (sug) { d.gym.setkg = d.gym.setkg || {}; const kg = (d.gym.setkg[ex] || []).slice(); kg[i] = sug; for (let j = 0; j < kg.length; j++) if (kg[j] === undefined) kg[j] = null; d.gym.setkg[ex] = kg; }
    }
  });
});
view.addEventListener("change", e => {
  const el = e.target, a = el.dataset && el.dataset.act;
  if (el.id === "restore-file" && el.files && el.files[0]) {
    el.files[0].text().then(txt => {
      const data = JSON.parse(txt);
      if (!data || data.app !== "surplus" || typeof data.docs !== "object") throw new Error("not a backup");
      Object.assign(S.docs, data.docs); saveLocal();
      UI.backupMsg = `Restored ${Object.keys(data.docs).filter(id => id.startsWith("day-")).length} days from ${String(data.saved || "").slice(0, 10)}.`;
      render();
    }).catch(() => { UI.backupMsg = "That file isn't a Surplus backup. Pick a file named surplus-backup-….json."; render(); });
    return;
  }
  if (a === "setkg") {
    const v = parseFloat(el.value), ex = el.dataset.ex, i = +el.dataset.i;
    patchDay(UI.date, d => {
      d.gym = d.gym || {}; d.gym.setkg = d.gym.setkg || {};
      if (!("session" in d.gym)) d.gym.session = sessionOf(UI.date);
      const kg = (d.gym.setkg[ex] || []).slice();
      kg[i] = v > 0 ? Math.round(v * 4) / 4 : null;
      for (let j = 0; j < kg.length; j++) if (kg[j] === undefined) kg[j] = null;
      d.gym.setkg[ex] = kg;
    });
  } else if (a === "sch") {
    const dw = el.dataset.d, f = el.dataset.f;
    patchSched(dw, s => {
      if (f === "noshift") s.shift = el.checked ? null : ["02:00","10:00"];
      else if (f === "nouni") s.uni = el.checked ? null : ["09:00","12:00"];
      else if (el.value) {
        const key = f[0] === "s" ? "shift" : "uni", idx = +f[1];
        if (s[key]) s[key][idx] = el.value;
      }
    });
  }
});
view.addEventListener("submit", e => {
  if (e.target.classList.contains("addform")) {
    e.preventDefault();
    const slot = e.target.dataset.slot, kEl = document.getElementById("cf-kcal");
    const kcal = Math.round(parseFloat(kEl.value));
    if (!(kcal > 0 && kcal <= 5000)) { kEl.focus(); kEl.placeholder = "kcal?"; return; }
    const name = document.getElementById("cf-name").value.trim().slice(0, 60) || "My food";
    const prot = Math.max(0, Math.round(parseFloat(document.getElementById("cf-prot").value) || 0));
    const save = slot === "extra" && document.getElementById("cf-save").checked;
    const id = "c" + Date.now().toString(36);
    UI.addSlot = null;
    if (document.activeElement) document.activeElement.blur();
    if (save) patchDoc("settings", d => {
      d.myFoods = (d.myFoods || []).filter(f => f.name.toLowerCase() !== name.toLowerCase());
      d.myFoods.push({id, name, kcal, prot});
      if (d.myFoods.length > 24) d.myFoods.shift();
    });
    patchDay(UI.date, d => { d.custom = d.custom || {}; d.custom[id] = {slot, name, kcal, prot}; });
    return;
  }
  if (e.target.id !== "wform") return;
  e.preventDefault();
  const date = document.getElementById("wdate").value || todayKey();
  const kg = parseFloat(document.getElementById("wkg").value);
  if (!(kg > 25 && kg < 200)) { document.getElementById("wkg").focus(); return; }
  document.activeElement && document.activeElement.blur();
  patchDay(date, d => { d.weight = Math.round(kg*10)/10; d.habits = d.habits || {}; d.habits.weigh = true; });
});

render();
</script>
